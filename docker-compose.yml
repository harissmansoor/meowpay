services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: meowpay
      POSTGRES_PASSWORD: meowpay
      POSTGRES_DB: meowpay_development
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meowpay -d meowpay_development"]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://meowpay:meowpay@db:5432/meowpay_development
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
